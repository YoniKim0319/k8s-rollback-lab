apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollback-lab
  labels:
    app: rollback-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rollback-lab
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: rollback-lab
    spec:
      containers:
        - name: rollback-lab
          image: rollback-lab:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_ENV
              value: "production"
            - name: FORCE_NOT_READY
              value: "false"
            - name: SLOW_READY_MS
              value: "0"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
