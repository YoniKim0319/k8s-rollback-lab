name: CI/CT Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r app/requirements.txt

      - name: 테스트 실행
        working-directory: app
        run: pytest test_main.py -v

  docker-build:
    name: Docker 빌드
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드 (push 없음)
        run: docker build -t rollback-lab:${{ github.sha }} .

  k8s-manifest-validate:
    name: k8s manifest 검증
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform 설치
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: manifest 검증 (클러스터 불필요)
        run: kubeconform -strict -summary k8s/deployment.yaml k8s/service.yaml

  ct-rollback-verification:
    name: CT - 롤백 시나리오 자동 검증
    runs-on: ubuntu-latest
    needs: [docker-build, k8s-manifest-validate]
    steps:
      - uses: actions/checkout@v4

      - name: kind 클러스터 생성
        uses: helm/kind-action@v1
        with:
          cluster_name: kind

      - name: Docker 이미지 빌드 (kind용 태그)
        run: docker build -t rollback-lab:latest .

      - name: 이미지를 kind 클러스터에 로드 (레지스트리 push 불필요)
        run: kind load docker-image rollback-lab:latest

      - name: v1(정상) 배포
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/rollback-lab --timeout=60s

      - name: v1 정상 상태 확인 (/ready = 200)
        run: |
          kubectl port-forward svc/rollback-lab 8080:80 &
          PF_PID=$!
          sleep 3
          curl -sf http://localhost:8080/ready
          kill $PF_PID

      - name: v2(장애) 배포 — FORCE_NOT_READY=true 주입
        run: |
          kubectl set env deployment/rollback-lab APP_VERSION=2.0.0 FORCE_NOT_READY=true

      - name: rollout이 자동으로 정지하는지 확인
        run: |
          # readinessProbe 실패로 rollout이 끝나지 못하고 timeout 나는 게 정상 (= 통과 조건)
          if kubectl rollout status deployment/rollback-lab --timeout=60s; then
            echo "::error::장애 배포인데 rollout이 완료됨 — readinessProbe가 트래픽을 막지 못함"
            exit 1
          fi
          echo "예상대로 rollout이 정지됨 (readinessProbe가 v1 Pod를 보존)"

      - name: 롤백 실행 (kubectl rollout undo)
        run: kubectl rollout undo deployment/rollback-lab

      - name: 롤백 후 v1로 복구됐는지 확인
        run: |
          kubectl rollout status deployment/rollback-lab --timeout=60s
          kubectl port-forward svc/rollback-lab 8080:80 &
          PF_PID=$!
          sleep 3
          curl -sf http://localhost:8080/ready
          kill $PF_PID

# CD(실제 클러스터 배포 자동화)는 위 CT와는 별개로, 아직 구현 전.
# GitHub Actions가 아닌 ArgoCD(GitOps)로 하기로 설계만 해둔 상태:
#
#   CI (GitHub Actions) : 코드 품질 검증 (test / build / manifest validate)
#   CT (GitHub Actions) : kind 클러스터에서 배포/롤백 시나리오 자동 재검증 — 이 파일의 ct-rollback-verification
#   CD (ArgoCD, 미구현) : 실제 운영 클러스터 배포 — k8s/ 디렉토리를 감시하며 자동 동기화
#
# ArgoCD(Pull 방식)를 선택하기로 한 이유:
#   - Push 방식(Actions → kubectl apply)은 클러스터 자격증명을 GitHub Secrets에 넣어야 하는 보안 리스크
#   - ArgoCD는 클러스터 안에서 Git을 감시하므로 외부에 자격증명 노출 불필요
#   - Git이 Single Source of Truth, Self-Healing으로 클러스터 drift 자동 복원
#
