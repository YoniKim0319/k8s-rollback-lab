name: CI/CD/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r app/requirements.txt

      - name: 테스트 실행
        working-directory: app
        run: pytest test_main.py -v

  docker-build:
    name: Docker 빌드
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드 (push 없음)
        run: docker build -t rollback-lab:${{ github.sha }} .

  k8s-manifest-validate:
    name: k8s manifest 검증
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: kubeconform 설치
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: manifest 검증 (클러스터 불필요)
        run: kubeconform -strict -summary k8s/deployment.yaml k8s/service.yaml

# CD는 GitHub Actions가 아닌 ArgoCD(GitOps)가 담당
#
# 파이프라인 역할 분리:
#   CI (GitHub Actions) : 코드 품질 검증 — 이 파일
#   CD (ArgoCD)         : 클러스터 배포 — k8s/ 디렉토리 감시
#
# ArgoCD를 선택한 이유:
#   - Push 방식(Actions → kubectl apply)은 클러스터 자격증명을
#     GitHub Secrets에 노출해야 하는 보안 리스크 존재
#   - ArgoCD는 Pull 방식 — 클러스터 안에서 Git을 감시하므로
#     외부에 자격증명 노출 불필요
#   - Git이 Single Source of Truth:
#     k8s/deployment.yaml 변경 → ArgoCD가 자동 감지 → 클러스터 동기화
#   - Self-Healing: 클러스터 상태가 Git과 달라지면 자동 복원
#
# ArgoCD 설치 (Minikube 기준):
#   kubectl create namespace argocd
#   kubectl apply -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#
# ArgoCD Application 설정:
#   - repoURL: https://github.com/YoniKim0319/k8s-rollback-lab
#   - path: k8s/
#   - syncPolicy: automated (self-heal: true)
#
