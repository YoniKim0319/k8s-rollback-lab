name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r app/requirements.txt

      - name: 테스트 실행
        working-directory: app
        run: pytest test_main.py -v

  docker-build:
    name: Docker 빌드
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드 (push 없음)
        run: docker build -t rollback-lab:${{ github.sha }} .

  k8s-dry-run:
    name: kubectl dry-run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: kubectl 설치
        uses: azure/setup-kubectl@v4

      - name: 더미 kubeconfig 생성
        run: |
          mkdir -p ~/.kube
          cat <<EOF > ~/.kube/config
          apiVersion: v1
          kind: Config
          clusters: []
          users: []
          contexts: []
          current-context: ""
          EOF

      - name: Deployment dry-run
        run: kubectl apply -f k8s/deployment.yaml --dry-run=client

      - name: Service dry-run
        run: kubectl apply -f k8s/service.yaml --dry-run=client
